<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loader</title>
</head>
<style>
body{ 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh;
     background: #0f172a;
} 

.loader {
     width: 60px; 
     height: 60px; 
     border: 6px solid #1e293b; border-top: 6px solid #38bdf8; border-radius: 50%; 
     animation: spin 1s linear infinite; 
} 

@keyframes spin 
{ 100% { transform: rotate(360deg); } }
</style>
<body>
    <div class="loader"></div>
</body>

<script>
   setTimeout(() => { document.querySelector(".loader").style.display = "none"; }, 3000); 
</script>
</html>
