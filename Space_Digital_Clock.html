<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Digital Clock</title>
  <style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  
  background-image: url('https://images.pexels.com/photos/110854/pexels-photo-110854.jpeg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  width: 100vw;
  margin: 0;
  overflow: hidden;
}
.liquid-glass {
  width: 600px;
  height: 220px;
  border-radius: 56px;
  position: relative;
  isolation: isolate;
  box-shadow: 0px 6px 24px rgba(0, 0, 0, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: none;
  padding: 0;
  margin: 0;
  text-decoration: none;
  cursor: default;
}

.liquid-glass:focus {
  outline: none;
}

.liquid-glass::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 0;
  border-radius: 56px;
  box-shadow: inset 0 0 15px -5px #000000;
  background-color: rgba(255, 255, 255, 0);
}

.liquid-glass::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: 56px;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  filter: url(#glass-distortion);
  -webkit-filter: url(#glass-distortion);
}

.clock-container {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 1;
}

.digital-clock {
  font-family: 'Arial', 'Microsoft YaHei', '微软雅黑', monospace;
  font-size: 56px;
  font-weight: 700;
  color: #fffdfd;
  text-shadow: 
    0px 2px 4px rgba(0, 0, 0, 0.4),
    0px 0px 10px rgba(255, 255, 255, 0.1);
  letter-spacing: 3px;
  filter: url(#text-glass-effect);
  -webkit-filter: url(#text-glass-effect);
}

.date-display {
  font-family: 'Arial', 'Microsoft YaHei', '微软雅黑', sans-serif;
  font-size: 18px;
  font-weight: 400;
  color: rgba(80, 73, 73, 0.8);
  text-shadow: 0px 1px 2px rgba(0, 0, 0, 0.3);
  margin-top: 12px;
  letter-spacing: 1px;
  filter: url(#text-glass-effect);
  -webkit-filter: url(#text-glass-effect);
}

  </style>
</head>
<body>
  <div class="liquid-glass">
    <div class="clock-container">
      <div class="digital-clock" id="clock">00:00:00</div>
      <div class="date-display" id="date">Loading...</div>
    </div>
  </div>

  <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <defs>
      <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.009 0.009" numOctaves="2" seed="92" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
        <feDisplacementMap in="SourceGraphic" in2="blurred" scale="77" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      
      <filter id="text-glass-effect" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.015 0.015" numOctaves="1" seed="45" result="textNoise" />
        <feGaussianBlur in="textNoise" stdDeviation="1" result="textBlurred" />
        <feDisplacementMap in="SourceGraphic" in2="textBlurred" scale="3" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <script>
    function updateClock() {
      const now = new Date();
      
      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const seconds = now.getSeconds().toString().padStart(2, '0');
      
      const timeString = `${hours}<span class="time-separator">:</span>${minutes}<span class="time-separator">:</span>${seconds}`;
      document.getElementById('clock').innerHTML = timeString;
      
      const options = { 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric',
        weekday: 'long'
      };
      const dateString = now.toLocaleDateString('en-US', options);
      document.getElementById('date').textContent = dateString;
    }
    
    updateClock();
    
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
